[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "powerpoint-quote-linker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "lxml==5.3.0",
    "python-pptx==1.0.2",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.4",
]

[project.scripts]
ppt-quote-linker = "ppt_quote_linker.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
